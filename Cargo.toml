[package]
name = "rview"
version = "0.1.0"
edition = "2021"
description = "Rust + egui 製のクロスプラットフォーム画像ビューワー"
license = "MIT"
repository = "https://github.com/TomoyukiNakama/rview"
readme = "README.md"
keywords = ["image-viewer", "egui", "gui"]
categories = ["multimedia::images"]

[[bin]]
name = "rview"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp"] }
raw-window-handle = "0.6"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-cursor = "0.31"


[profile.release]
opt-level = 3
strip = true
