[package]
name = "rview"
version = "0.1.0"
edition = "2021"
description = "Rust + egui 製のクロスプラットフォーム画像ビューワー"
license = "MIT"
repository = "https://github.com/TomoyukiNakama/rview"
readme = "README.md"
keywords = ["image-viewer", "egui", "gui"]
categories = ["multimedia::images"]

[[bin]]
name = "rviewer"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
crc32fast = "1"
eframe = "0.31"
egui = "0.31"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp"] }
image-webp = "0.2"
notify = "8"
raw-window-handle = "0.6"
tiff = "0.10"
trash = "5"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-cursor = "0.31"
# Wayland のタイトルバー（sctk-adwaita）を fontconfig 経由で描画し、日本語をフォールバックで表示する
# （既定の ab_glyph 描画は 1 フォントだけで描くため、日本語が豆腐になる）
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita-crossfont"] }


[profile.release]
opt-level = 3
strip = true
